<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Login</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f0f2f5;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}
.box {
    background: white;
    padding: 25px;
    width: 320px;
    border-radius: 6px;
    box-shadow: 0 4px 10px rgba(0,0,0,.1);
}
input, select, button {
    width: 100%;
    padding: 8px;
    margin-bottom: 10px;
}
button {
    cursor: pointer;
}
</style>
</head>

<body>

<div class="box">

<h2 id="titulo">Login</h2>

<!-- LOGIN -->
<div id="login">
    <input id="loginEmail" type="email" placeholder="Email">
    <input id="loginSenha" type="password" placeholder="Senha">

    <button type="button" onclick="login()">Entrar</button>
    <button type="button" onclick="mostrarCadastro()">Cadastrar</button>
</div>

<!-- CADASTRO -->
<div id="cadastro" style="display:none">
    <input id="cadEmail" type="email" placeholder="Email">
    <input id="cadSenha" type="password" placeholder="Senha">

    <select id="cadTipo">
        <option value="aluno">Aluno</option>
        <option value="professor">Professor</option>
        <option value="admin">Administrador</option>
    </select>

    <button type="button" onclick="cadastrar()">Salvar</button>
    <button type="button" onclick="mostrarLogin()">Voltar</button>
</div>

</div>

<script>
const API = 'http://localhost:3000/api/auth';

function mostrarCadastro() {
    document.getElementById('login').style.display = 'none';
    document.getElementById('cadastro').style.display = 'block';
    document.getElementById('titulo').innerText = 'Cadastro';
}

function mostrarLogin() {
    document.getElementById('cadastro').style.display = 'none';
    document.getElementById('login').style.display = 'block';
    document.getElementById('titulo').innerText = 'Login';
}

async function cadastrar() {
    const email = document.getElementById('cadEmail').value.trim();
    const senha = document.getElementById('cadSenha').value.trim();
    const tipo = document.getElementById('cadTipo').value;

    if (!email || !senha) {
        alert('Preencha todos os campos');
        return;
    }

    try {
        const res = await fetch(`${API}/register`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, senha, tipo })
        });

        const data = await res.json();

        if (!res.ok) {
            alert(data.error);
            return;
        }

        alert('Cadastro realizado com sucesso');
        mostrarLogin();

    } catch (e) {
        alert('Erro ao conectar com o backend');
    }
}

async function login() {
    const email = document.getElementById('loginEmail').value.trim();
    const senha = document.getElementById('loginSenha').value.trim();

    if (!email || !senha) {
        alert('Preencha todos os campos');
        return;
    }

    const res = await fetch(`${API}/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, senha })
    });

    const data = await res.json();

    if (!res.ok) {
        alert(data.error);
        return;
    }

    localStorage.setItem('token', data.token);
    localStorage.setItem('tipo', data.tipo);
    localStorage.setItem('email', email);

    if (data.tipo === 'admin') location.href = 'admin.html';
    else if (data.tipo === 'professor') location.href = 'professor.html';
    else location.href = 'aluno.html';
}
</script>

</body>
</html>

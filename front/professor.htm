<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>UFC - Área Professor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container" style="display:block; width: 600px; margin: auto;">
        <div class="card" style="width: 100%;">
            <h2>Gestão Acadêmica</h2>
            <input type="text" id="nomeA" placeholder="Nome Aluno">
            <input type="text" id="matA" placeholder="Matrícula">
            <button onclick="salvar('/alunos', {nome: nomeA.value, matricula: matA.value})">Cadastrar Aluno</button>
            <hr>
            <input type="text" id="nomeP" placeholder="Nome Professor">
            <input type="text" id="espP" placeholder="Especialidade">
            <button onclick="salvar('/professores', {nome: nomeP.value, especialidade: espP.value})">Cadastrar Professor</button>
        </div>
    </div>
    <script>
        async function salvar(rota, dados) {
            await fetch('http://localhost:3000' + rota, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(dados)
            });
            alert("Salvo!");
        }
    </script>
</body>
</html>

<h2>Cadastro de Aluno</h2>

<input id="nome" placeholder="Nome"><br>
<input id="email" placeholder="Email"><br>
<input id="curso" placeholder="Curso"><br>
<button onclick="cadastrar()">Salvar</button>

<script>
function cadastrar() {
    fetch('http://localhost:3000/api/alunos', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'Authorization': localStorage.getItem('token')
        },
        body: JSON.stringify({
            nome: nome.value,
            email: email.value,
            curso: curso.value
        })
    })
    .then(r => r.json())
    .then(() => alert('Aluno cadastrado'));
}
</script>

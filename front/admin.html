<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Painel do Administrador</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f0f2f5;
    margin: 0;
    padding: 20px;
}

h2 {
    color: #004a80;
}

button {
    padding: 6px 10px;
    cursor: pointer;
    background: #004a80;
    color: white;
    border: none;
    border-radius: 4px;
}

button:hover {
    background: #003359;
}

table {
    width: 100%;
    border-collapse: collapse;
    background: white;
    margin-top: 20px;
}

th, td {
    border: 1px solid #ccc;
    padding: 8px;
    text-align: center;
}

th {
    background: #004a80;
    color: white;
}

.topo {
    display: flex;
    justify-content: space-between;
    align-items: center;
}
</style>
</head>

<body>

<div class="topo">
    <h2>Painel do Administrador</h2>
    <button onclick="logout()">Sair</button>
</div>

<table>
    <thead>
        <tr>
            <th>ID</th>
            <th>Email</th>
            <th>Tipo</th>
            <th>Ações</th>
        </tr>
    </thead>
    <tbody id="tabelaUsuarios"></tbody>
</table>

<script>
    const API = 'http://localhost:3000/api';
    const token = localStorage.getItem('token');
    const tipo = localStorage.getItem('tipo');

    if (!token || tipo !== 'admin') {
        alert('Acesso negado');
        location.href = 'login.html';
    }

    // ================= LISTAR USUÁRIOS =================
    async function carregarUsuarios() {
        const tabela = document.getElementById('tabelaUsuarios');
        tabela.innerHTML = `<tr><td colspan="4">Carregando...</td></tr>`;

        try {
            const res = await fetch(`${API}/admin/usuarios`, {
                headers: {
                    Authorization: 'Bearer ' + token
                }
            });

            if (!res.ok) {
                throw new Error('Erro ao buscar usuários');
            }

            const data = await res.json();

            // Caso a API retorne { usuarios: [...] }
            const usuarios = Array.isArray(data) ? data : data.usuarios;

            tabela.innerHTML = '';

            if (!usuarios || usuarios.length === 0) {
                tabela.innerHTML = `
                <tr>
                    <td colspan="4">Nenhum usuário cadastrado</td>
                </tr>
            `;
                return;
            }

            usuarios.forEach(u => {
                tabela.innerHTML += `
                <tr>
                    <td>${u.id}</td>
                    <td>${u.email}</td>
                    <td>${u.tipo}</td>
                    <td>
                        <button onclick="excluir(${u.id})">Excluir</button>
                    </td>
                </tr>
            `;
            });

        } catch (error) {
            tabela.innerHTML = `
            <tr>
                <td colspan="4">Erro ao carregar usuários</td>
            </tr>
        `;
            console.error(error);
        }
    }

    // ================= EXCLUIR =================
    async function excluir(id) {
        if (!confirm('Deseja excluir este usuário?')) return;

        await fetch(`${API}/admin/usuarios/${id}`, {
            method: 'DELETE',
            headers: {
                Authorization: 'Bearer ' + token
            }
        });

        carregarUsuarios();
    }

    function logout() {
        localStorage.clear();
        location.href = 'login.html';
    }

    carregarUsuarios();
</script>
</body>
</html>
